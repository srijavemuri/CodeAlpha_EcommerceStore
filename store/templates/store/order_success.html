
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - Fashion Store</title>

    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

    <header>
        <h1>Fashion Store 👗</h1>

    <script>
