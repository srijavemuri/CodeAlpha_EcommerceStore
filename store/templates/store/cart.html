
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Fashion Store</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

    <header>
        <h1>Fashion Store 👗</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/cart/">Cart 🛒</a>
            <a href="/login/">Login</a>
        </nav>
    </header>

    <section class="products">
        <h2>Your Shopping Cart 🛒</h2>

        <div id="cart-items">
            <!-- Cart products appear here -->
        </div>

        <h3 id="cart-total"></h3>

        <!-- Checkout Form -->
        <form id="checkout-form" method="POST" action="/checkout/">
            {% csrf_token %}

            <input type="hidden" name="cart_data" id="cart-data">

            <button type="submit" class="add-cart">
                Place Order 🛍️
            </button>
        </form>

        <br>

        <button onclick="clearCart()" class="add-cart">
            Clear Cart
        </button>

        <br><br>

        <a href="/">← Continue Shopping</a>
    </section>

    <footer>
        <p>© 2026 Fashion Store. All rights reserved.</p>
    </footer>

    <script>

        // Display cart products
        function displayCart() {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            let cartItems = document.getElementById("cart-items");
            let cartTotal = document.getElementById("cart-total");
            let checkoutForm = document.getElementById("checkout-form");

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.innerHTML = "<p>Your cart is empty.</p>";
                cartTotal.innerHTML = "";

                checkoutForm.style.display = "none";

                return;
            }

            checkoutForm.style.display = "block";

            let total = 0;

            cart.forEach(function(item) {

                let product = document.createElement("div");
                product.className = "product-card";

                let name = document.createElement("h3");
                name.textContent = item.name;

                let price = document.createElement("p");
                price.textContent = "Price: ₹" + item.price;

                product.appendChild(name);
                product.appendChild(price);
                cartItems.appendChild(product);

                total += Number(item.price);
            });

            cartTotal.textContent = "Total: ₹" + total.toFixed(2);
        }


        // Clear all cart products
        function clearCart() {

            localStorage.removeItem("cart");

            displayCart();
        }


        // Send cart data to Django when placing an order
        document.getElementById("checkout-form").addEventListener(
            "submit",
            function(event) {

                let cart = JSON.parse(localStorage.getItem("cart")) || [];

                if (cart.length === 0) {
                    event.preventDefault();
                    alert("Your cart is empty!");
                    return;
                }

                document.getElementById("cart-data").value =
                    JSON.stringify(cart);
            }
        );


        // Display cart when page loads
        displayCart();

    </script>

</body>
</html>
